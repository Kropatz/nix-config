#     position = 0, -8
#     halign = center
#     valign = center
#     shadow_passes = 4
#     shadow_size = 15
#     shadow_color = rgba(203, 166, 247, 0.15)
# }

# Avatar
image {
    monitor =
    path = $HOME/.face
    size = 120
    border_size = 3
    border_color = $accent
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    # shadow_color = rgba(139, 125, 255, 0.5)
    shadow_color= $shadow_color
}

# ==============================================================================
# WELCOME MESSAGE
# ==============================================================================

label {
    monitor =
    text = Welcome back, $USER
    color = $text
    font_size = 18
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow_color
}

# ==============================================================================
# INPUT FIELD
# ==============================================================================


input-field {
    monitor =
    size = 280, 45
    position = 0, -170
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = Password...
    hide_input = false
    check_color = $check
    fail_color = $fail
    fail_text = Authentication Failed! ($ATTEMPTS)
    capslock_color = $capslock
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 10
    # shadow_color = rgba(139, 125, 255, 0.4)
    shadow_color = $shadow_color
}

general {
  disable_loading_bar=true
  grace=0
  hide_cursor=true
  no_fade_in=false
}
