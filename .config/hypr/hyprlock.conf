# TODO: Set from stylix
$accent=rgb(7b9696) # base 03
$surface0=rgb(041011) # base 00
$shadow_color=rgba(7b969680) # base 03
$dark_text=rgb(b0cccc) # base 04
$dark_text_opacity=rgba(b0cccc80) # base 04
$text=rgb(d7e5e5) # base 05
$fail=rgb(ed8796) # base 08
$check=rgb(eed49f) # base 0A
$capslock=rgb(ed8796) # base 05

auth {
  fingerprint {
    enabled=true
  }
}

background {
  path=/nix/store/00xwwb4cy98q314hhh3agcjc643413qi-ina.jpg
  blur_passes = 3
  blur_size = 8
  noise = 0.0117
  contrast = 1.3000
  brightness = 0.6000
  vibrancy = 0.2100
  vibrancy_darkness = 0.1
}

# ==============================================================================
# TIME
# ==============================================================================

# Time glow effect
# label {
#     monitor =
#     text = $TIME
#     color = $dark_text
#     font_size = 85
#     font_family = $font
#     position = 2, 152
#     halign = center
#     valign = center
# }

# Time display
label {
    monitor =
    text = $TIME
    color = $dark_text
    font_size = 80
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    # shadow_color = rgba(203, 166, 247, 0.6)
    shadow_color= $shadow_color
}

# ==============================================================================
# DATE
# ==============================================================================

label {
    monitor =
    text = cmd[update:3600000] date +"%A, %d %B %Y"
    color = $text
    font_size = 20
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ==============================================================================
# KB Layout
# ==============================================================================
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $dark_text_opacity
    font_size = 12
    font_family = $font
    position = -30, 30
    halign = right
    valign = bottom
}

